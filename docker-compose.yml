services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpschool-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CENTRAL_SERVER_URL=${NEXT_PUBLIC_CENTRAL_SERVER_URL:-http://localhost:4000}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    networks:
      - carpschool_web_net

networks:
  carpschool_web_net:
    driver: bridge
